services:
  app:
    build:
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - ./src:/app/src
    environment:
        - ENVIRONMENT=development
        - DEBUG=True
        - DATABASE_URL=${POSTGRES_URL}
        - PYTHONPATH=/app/src
    develop:
      watch:
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile
        - action: sync
          path: src
          target: /app

    env_file:
      - .env
    depends_on:
      - db_service

  db_service:
    image: postgres:17.5
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
